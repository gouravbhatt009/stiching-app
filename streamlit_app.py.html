<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stitching Cost Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 30px;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 20px;
        }
        
        header h1 {
            color: #333;
            font-size: 2.5em;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .tab-button {
            padding: 12px 20px;
            border: none;
            background: #f0f0f0;
            cursor: pointer;
            border-radius: 5px;
            font-size: 16px;
            transition: all 0.3s;
            font-weight: 500;
        }
        
        .tab-button.active {
            background: #667eea;
            color: white;
        }
        
        .tab-button:hover {
            background: #667eea;
            color: white;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .section {
            margin-bottom: 30px;
        }
        
        .section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
            border-left: 4px solid #667eea;
            padding-left: 10px;
        }
        
        .form-group {
            margin-bottom: 15px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .form-group.full {
            grid-template-columns: 1fr;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-family: inherit;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }
        
        button {
            padding: 12px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        button.delete {
            background: #dc3545;
            padding: 8px 12px;
            font-size: 14px;
        }
        
        button.delete:hover {
            background: #c82333;
        }
        
        button.edit {
            background: #28a745;
            padding: 8px 12px;
            font-size: 14px;
        }
        
        button.edit:hover {
            background: #218838;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        thead {
            background: #667eea;
            color: white;
        }
        
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        tbody tr:hover {
            background: #f9f9f9;
        }
        
        .actions {
            display: flex;
            gap: 10px;
        }
        
        .alert {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
            display: none;
        }
        
        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        
        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        
        .summary-box {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 5px;
            border-left: 4px solid #667eea;
            margin-top: 20px;
        }
        
        .summary-box h3 {
            color: #667eea;
            margin-bottom: 15px;
        }
        
        .summary-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        
        .summary-item:last-child {
            border-bottom: none;
        }
        
        .summary-item .label {
            font-weight: 600;
            color: #333;
        }
        
        .summary-item .value {
            color: #667eea;
            font-weight: 600;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        
        .modal-header {
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 15px;
        }
        
        .modal-header h3 {
            color: #667eea;
        }
        
        .close-modal {
            float: right;
            font-size: 24px;
            font-weight: bold;
            color: #aaa;
            cursor: pointer;
        }
        
        .close-modal:hover {
            color: #000;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧵 Stitching Cost Management System</h1>
        </header>
        
        <div class="tabs">
            <button class="tab-button active" onclick="switchTab('employees')">👥 Employees</button>
            <button class="tab-button" onclick="switchTab('styles')">👗 Styles</button>
            <button class="tab-button" onclick="switchTab('rates')">💵 Hourly Rates</button>
            <button class="tab-button" onclick="switchTab('challan')">📋 Challan Tracking</button>
            <button class="tab-button" onclick="switchTab('reports')">📊 Reports</button>
        </div>
        
        <!-- EMPLOYEES TAB -->
        <div id="employees" class="tab-content active">
            <div class="section">
                <h2>Employee Master Sheet</h2>
                <div id="employees-alert" class="alert"></div>
                
                <div class="form-group full">
                    <label for="emp-name">Employee Name:</label>
                    <input type="text" id="emp-name" placeholder="Enter employee name">
                </div>
                
                <div class="form-group full">
                    <button onclick="addEmployee()">➕ Add Employee</button>
                </div>
                
                <table id="employees-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Employee Name</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        
        <!-- STYLES TAB -->
        <div id="styles" class="tab-content">
            <div class="section">
                <h2>Style Master Sheet</h2>
                <div id="styles-alert" class="alert"></div>
                
                <div class="form-group">
                    <div>
                        <label for="style-name">Style Name:</label>
                        <input type="text" id="style-name" placeholder="Enter style name">
                    </div>
                    <div>
                        <label for="style-id">Style ID:</label>
                        <input type="text" id="style-id" placeholder="Enter style ID">
                    </div>
                </div>
                
                <div class="form-group full">
                    <button onclick="addStyle()">➕ Add Style</button>
                </div>
                
                <table id="styles-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Style Name</th>
                            <th>Style ID</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        
        <!-- HOURLY RATES TAB -->
        <div id="rates" class="tab-content">
            <div class="section">
                <h2>Employee Hourly Rates</h2>
                <div id="rates-alert" class="alert"></div>
                
                <div class="form-group">
                    <div>
                        <label for="rate-employee">Employee:</label>
                        <select id="rate-employee"></select>
                    </div>
                    <div>
                        <label for="hourly-rate">Hourly Rate (₹):</label>
                        <input type="number" id="hourly-rate" placeholder="Enter hourly rate" min="0" step="0.01">
                    </div>
                </div>
                
                <div class="form-group full">
                    <button onclick="setHourlyRate()">💾 Save Hourly Rate</button>
                </div>
                
                <table id="rates-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Employee Name</th>
                            <th>Hourly Rate (₹)</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        
        <!-- CHALLAN TRACKING TAB -->
        <div id="challan" class="tab-content">
            <div class="section">
                <h2>Challan Work Assignment</h2>
                <div id="challan-alert" class="alert"></div>
                
                <div class="form-group">
                    <div>
                        <label for="challan-number">Challan Number:</label>
                        <input type="text" id="challan-number" placeholder="Enter challan number">
                    </div>
                    <div>
                        <label for="challan-style">Style:</label>
                        <select id="challan-style"></select>
                    </div>
                </div>
                
                <div class="form-group">
                    <div>
                        <label for="challan-employee">Employee:</label>
                        <select id="challan-employee"></select>
                    </div>
                    <div>
                        <label for="challan-hours">Hours Worked:</label>
                        <input type="number" id="challan-hours" placeholder="Enter hours worked" min="0" step="0.5">
                    </div>
                </div>
                
                <div class="form-group full">
                    <button onclick="addChallanEntry()">➕ Add Work Entry</button>
                </div>
